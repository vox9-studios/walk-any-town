<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walk any town, in letters</title>
<style>
:root{
  --night:#07081a; --paper:#ece7cf; --ink:#17182c; --amber:#f2a33a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#0d0e22;--ink:#e9e4c8}
}
:root[data-theme="dark"]{--paper:#0d0e22;--ink:#e9e4c8}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  display:flex;flex-direction:column;overflow:hidden;
}
header{display:flex;flex-wrap:wrap;gap:.45rem .8rem;align-items:center;padding:.55rem .9rem}
h1{font-size:1rem;line-height:1.2;margin:0;font-weight:700}
h1 button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
h1 button:hover{text-decoration:underline}
form{display:flex;gap:.4rem;flex:1 1 16rem;min-width:0}
input{
  font:inherit;font-size:.85rem;color:inherit;background:transparent;flex:1;min-width:0;
  border:1px solid var(--ink);padding:.4rem .55rem;border-radius:0;
}
.controls{display:flex;gap:.4rem;flex-wrap:wrap}
button,select{
  font:inherit;font-size:.8rem;color:inherit;background:transparent;border-radius:0;
  border:1px solid var(--ink);padding:.4rem .65rem;cursor:pointer;
}
select[hidden]{display:none}
button[aria-pressed="true"],form button{background:var(--ink);color:var(--paper)}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;background:var(--night);touch-action:none;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;transition:opacity .5s}
.controls[hidden]{display:none}
/* bars top and bottom while the showcase runs: it is a piece of film, not a view */
#stage.cinema::before,#stage.cinema::after{
  content:'';position:absolute;left:0;right:0;height:6.5%;background:#07081a;pointer-events:none;z-index:2;
}
#stage.cinema::before{top:0}
#stage.cinema::after{bottom:0}
#front{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.95rem;padding:1.2rem;text-align:center;pointer-events:none;
}
#front[hidden]{display:none}
#front>*{pointer-events:auto}
#front h2{margin:0;font-weight:700;line-height:1.15;font-size:clamp(1.35rem,4.6vw,2.5rem);
  color:#f6f1da;text-shadow:0 2px 14px #07081ae6}
#front p{margin:0;max-width:34rem;font-size:.92rem;line-height:1.5;color:#ece7cf;text-shadow:0 1px 10px #07081ae6}
#front form{width:min(34rem,92%);flex:none}
#front select{background:#07081ab8;color:#f6f1da;border-color:#e9e4c8cc;font-size:.92rem;padding:.55rem .7rem}
#front input{background:#07081ab8;color:#f6f1da;border-color:#e9e4c8cc;font-size:1rem;padding:.72rem .85rem}
#front input::placeholder{color:#e9e4c899}
#front button{background:#f6f1da;color:#07081a;border-color:#f6f1da;font-size:1rem;padding:.72rem 1.1rem}
#frontnote{font-size:.76rem;letter-spacing:.04em;color:#e9e4c8cc;text-shadow:0 1px 10px #07081ae6}
canvas:active{cursor:grabbing}
#msg{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(30rem,88%);
  color:#e9e4c8;background:#07081ae6;border:1px solid #e9e4c866;padding:.9rem 1.1rem;font-size:.85rem;line-height:1.5;
}
#msg:empty{display:none}
#jump,#run{
  position:absolute;right:1rem;display:none;
  color:#e9e4c8;border-color:#e9e4c8aa;background:#07081acc;padding:.9rem 1.1rem;font-size:.9rem;
}
#jump{bottom:1rem}
#run{bottom:4.6rem}
#run[aria-pressed="true"]{background:#e9e4c8;color:#07081a;border-color:#e9e4c8}
#map{
  position:absolute;right:1rem;top:1rem;width:7.5rem;height:7.5rem;
  border:1px solid #e9e4c8aa;border-radius:50%;background:#07081acc;
  pointer-events:none;image-rendering:pixelated;
}
#map[hidden]{display:none}
@media (max-width:34rem){#map{width:5.5rem;height:5.5rem;right:.6rem;top:.6rem}}
#stick{position:absolute;width:96px;height:96px;border:1px dashed #e9e4c8aa;border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%)}
#nub{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;background:#e9e4c8aa}
@media (pointer:coarse){#jump,#run{display:block}}
footer{padding:.3rem .9rem;font-size:.7rem;line-height:1.35;display:flex;justify-content:space-between;
  gap:.2rem 1rem;flex-wrap:wrap;opacity:.45;transition:opacity .25s}
footer:hover,footer:focus-within{opacity:1}
footer p{margin:0}
#bCredit{font-size:.66rem;line-height:1;padding:.18rem .42rem;border-radius:999px;vertical-align:baseline}
#street{font-weight:700}
a{color:inherit}
</style>
</head>
<body>
<header>
  <h1><button id="home" type="button" title="Back to the front screen">Walk any town, in letters</button></h1>
  <form id="go">
    <input id="q" aria-label="Street or town" placeholder="Street or town" value="High Street, East Grinstead" autocomplete="off" enterkeyhint="go" list="towns">
    <datalist id="towns"></datalist>
    <button type="submit">Build it</button>
  </form>
  <select id="flights" aria-label="Somewhere ready to walk" hidden><option value="">Somewhere ready…</option></select>
  <div class="controls">
    <button id="bRun" aria-pressed="true">Run</button>
    <button id="bDay" aria-pressed="true">Daylight</button>
    <button id="bTour" aria-pressed="false">Fly around</button>
    <button id="bColour" aria-pressed="true">Colour on</button>
    <button id="bDetail">Detail: finest</button>
    <button id="bBlocks" aria-pressed="true">Blocks on</button>
    <button id="bMap" aria-pressed="true">Map on</button>

  </div>
</header>
<div id="stage">
  <canvas id="cv" aria-label="First-person view of the town, drawn entirely with text characters"></canvas>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="front">
    <h2>Walk any town, in letters</h2>
    <p>Every street, building and hill is real, read from the map and drawn with nothing but characters.
       Type a place to walk it, or take one of the flights.</p>
    <div id="frontnote"></div>
  </div>
  <canvas id="map" width="96" height="96" aria-hidden="true"></canvas>
  <div id="stick"><div id="nub"></div></div>
  <button id="run" aria-pressed="true">Run</button>
  <button id="jump">Jump</button>
</div>
<footer>
  <p><span id="street"></span> <span id="hint"></span></p>
  <p><button id="bCredit" type="button" aria-expanded="false" title="Where the map comes from, and how fast it draws">i</button>
     <span id="more" hidden><span id="stat"></span><span id="ground"></span> </span><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a></p>
</footer>

function sizeTo(half,cell){       // half is how far the map data reaches from the middle, in metres

  // so a grid has a ceiling. Past it the square is not refused: the cells grow until it fits.
  const cap=c>=1.5?2048:2000;

// The ground, read off the grid of heights the build fetched: metres above the town's lowest point,
// in tenths, running west to east along each row and south to north down the rows.
function ground(ele){
  if(!ele||!ele.v||!(ele.n>1)){Gr.fill(G);return 0;}
  const n=ele.n, v=ele.v, s=(n-1)/(N-1), k=.1/CELL;

      if(h>top)top=h;
      Gr[y*N+x]=G+h*k;

  }
  return top*.1;
}

function parseCol(v){                  // building:colour and roof:colour, as a name or a #hex
  if(!v)return null;
  const t=String(v).trim().toLowerCase();
  if(t[0]==='#'){
    const h=t.slice(1);
    if(/^[0-9a-f]{3}$/.test(h))return[parseInt(h[0]+h[0],16),parseInt(h[1]+h[1],16),parseInt(h[2]+h[2],16)];

  const w=parseFloat(t.width);if(w>0)return Math.min(34,w);

function fillPoly(rings,fn){           // even-odd scanline fill, holes included
  let y0=N,y1=0;
  for(const r of rings)for(const p of r){if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];}
  y0=Math.max(0,Math.floor(y0));y1=Math.min(N-1,Math.ceil(y1));
  for(let y=y0;y<=y1;y++){
    const yc=y+.5,xs=[];
    for(const r of rings)for(let i=0;i+1<r.length;i++){
      const a=r[i],b=r[i+1];
      if((a[1]<=yc)!==(b[1]<=yc))xs.push(a[0]+(yc-a[1])*(b[0]-a[0])/(b[1]-a[1]));
    }
    xs.sort((p,q)=>p-q);
    for(let k=0;k+1<xs.length;k+=2){
      const xa=Math.max(0,Math.ceil(xs[k]-.5)),xb=Math.min(N-1,Math.floor(xs[k+1]-.5));
      for(let x=xa;x<=xb;x++)fn(y*N+x);
    }

      const ex=Math.floor(q[0]),ey=Math.floor(q[1]);
      if(ex<1||ey<1||ex>=N-2||ey>=N-2||Bi[ey*N+ex]!==i)continue;
      const h=Hm[ey*N+ex]+2.4;                          // a little over a metre of brick above the tiles
      for(let y=ey;y<=ey+1;y++)for(let x=ex;x<=ex+1;x++){
        const c=y*N+x;if(Bi[c]!==i)continue;
        Bi[c]=0;Ev[c]=0;Mt[c]=6;Hm[c]=h;
      }
    }
  }
  }
  // trees: mapped ones, woods, and a scatter over open grass
  const rnd=mulberry(Math.floor(Math.abs(lat0*1e4))+Math.floor(Math.abs(lon0*1e4))*31);
  const tree=(tx,ty,street)=>{
    const rad=(2.5+rnd()*2)/CELL,th=(6+rnd()*5)/CELL,cx=Math.floor(tx),cy=Math.floor(ty);
    if(cx<8||cy<8||cx>=N-8||cy>=N-8||Mt[cy*N+cx]!==0)return;
    const gb=Gr[cy*N+cx];
    for(let y=Math.floor(ty-rad);y<=ty+rad;y++)for(let x=Math.floor(tx-rad);x<=tx+rad;x++){
      const dd=Math.hypot(x+.5-tx,y+.5-ty),c=y*N+x;
      const rr=rad*(.78+.44*vnoise(x*.42+tx*.27,y*.42+ty*.27));   // a ragged outline, not a dome
      if(dd>=rr||Bi[c]||!(Mt[c]===0||Mt[c]===4||(street&&Mt[c]===2)))continue;
      const hh=gb+th*Math.sqrt(Math.max(0,1-dd*dd/(rr*rr)))*(.82+.36*hash2(x,y));
      if(hh>Hm[c]){Hm[c]=hh;Mt[c]=4;}
    }
  };
  for(const p of trees){const c=Math.floor(p[1])*N+Math.floor(p[0]);if(p[0]>8&&p[1]>8&&p[0]<N-8&&p[1]<N-8&&(Mt[c]===2||Mt[c]===9)){Mt[c]=0;}tree(p[0],p[1],true);}
  const wood=new Uint8Array(N*N);for(const r of woods)fillPoly(r,c=>{wood[c]=1;});
  const loose=Math.round(N*N/10000);   // trees nobody has mapped, sown thinly over open grass
  for(let k=0;k<5000;k++){const x=rnd()*N,y=rnd()*N,c=Math.floor(y)*N+Math.floor(x);if(wood[c]||k<loose)tree(x,y);}
  if(aim&&best>60){spawn.x=AX;spawn.y=AY;}          // asked to start somewhere with no named street near it
  // A street with no markings and nothing parked on it reads as a model of a street. Both are invented,
  // like the scattered trees, but a town without them looks emptier than any town is.
  if(CELL<1.5){
  const runOf=pts=>{
    const seg=[],cum=[0];let total=0;
    for(let i=0;i+1<pts.length;i++){const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);seg.push(l);cum.push(total+=l);}
    return{seg,cum,total};
  };
  for(const r of roads){                              // a broken white line where two cars could pass
    if(!car(r))continue;
    const wM=roadWidth(r.t);
    if(wM<5.6||r.t.oneway==='yes'||r.pts.length<2)continue;
    const run=runOf(r.pts);if(run.total<20)continue;
    fillLine(r.pts,1.1,(c,i,t)=>{
      if(Mt[c]!==5)return;
      const along=(run.cum[i]+t*run.seg[i])*CELL;      // metres, for the dashes
      if(along%7<3.2)Mt[c]=11;
    });
  }

  }
  // stand on the nearest open ground to the chosen spot
  let sx=Math.floor(spawn.x),sy=Math.floor(spawn.y),found=false;
  for(let r=0;r<300&&!found;r++)for(let a=0;a<Math.max(1,r*6)&&!found;a++){
    const x=Math.floor(spawn.x+r*Math.cos(a/(r||1))),y=Math.floor(spawn.y+r*Math.sin(a/(r||1)));
    if(x>2&&y>2&&x<N-2&&y<N-2&&!Bi[y*N+x]&&Mt[y*N+x]!==4&&Mt[y*N+x]!==3){sx=x;sy=y;found=true;}
  }
  spawn.x=sx+.5;spawn.y=sy+.5;
  worldReady=true;
  return {buildings:buildings.length,roads:roads.length,fall};
}

// cast shadows: for every cell, the height below which the light is blocked
function shadowMap(az,el){
  let top=G;for(let i=0;i<N*N;i++)if(Hm[i]>top)top=Hm[i];
  const out=new Float32Array(N*N),dx=Math.cos(az),dy=Math.sin(az),tn=Math.tan(el);
  const K=Math.min(300,Math.ceil((top-G+2)/tn));    // a hundred and fifty metres of shadow is plenty
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    let mh=-99;
    for(let k=1;k<=K;k++){
      const X=Math.floor(x+.5+dx*k),Y=Math.floor(y+.5+dy*k);
      if(X<0||Y<0||X>=N||Y>=N)break;
      const v=Hm[Y*N+X]-k*tn;if(v>mh)mh=v;
    }
    out[y*N+x]=mh;
  }
  return out;
}

/* ---------- the frame: arrays of characters and colours ---------- */
let W=0,H=0,chars,fgPix,bgPix,cw=6,chh=10;
let HR=0,chhR=10,Lt;              // rows of picture, and how tall one is: with blocks on, two to a row of type
let time=0, colour=true, blocks=1, aw=.01, ah=.01;
const SUN={az:Math.PI/2+.35,el:.95,map:null}, MOON={az:-Math.PI/2-.5,el:.55,map:null},   // midday, just past south
      DUSK={az:Math.PI-.16,el:.14,map:null};      // low, and in the west, where the sun goes
const MODENAME=['Night','Daylight','Evening'];
let mode=1,day=true,LAZ,LEL,LDX,LDY,LCOS,LSIN,shadowH=null;
let FOGE=.004;                    // haze as it stands this frame: thinner the higher you are
// Three quarters of a frame is spent shading cells. While the view is moving, shade every other row
// and repeat it: half the work for a picture that is sliding past anyway, full detail the moment you
// stand still. Off when the picture is already coarse, where the rows are too few to spare.
let easeRows=true, pcx=0,pcy=0,pcz=0,pcyaw=0,pcpit=0;
let AR,AG,AB,SR,SG,SB,FOG,FARG,FOGK,BGK,FGK,FGA,GAM,GAIN;
function setMode(m){
  mode=m===true?1:m===false?0:m;day=mode===1;
  const L=mode===1?SUN:mode===2?DUSK:MOON;
  if(!L.map&&worldReady)L.map=shadowMap(L.az,L.el);
  shadowH=L.map;LAZ=L.az;LEL=L.el;LDX=Math.cos(L.az);LDY=Math.sin(L.az);LCOS=Math.cos(L.el);LSIN=Math.sin(L.el);
  if(mode===1){AR=.37;AG=.42;AB=.55;SR=.98;SG=.92;SB=.78;FOG=[180,202,228];FARG=[152,186,170];FOGK=.0018;BGK=.8;FGK=1.22;FGA=8;GAM=1;GAIN=1.05;}
  else if(mode===2){AR=.30;AG=.29;AB=.36;SR=1.26;SG=.58;SB=.24;FOG=[190,150,130];FARG=[184,152,142];FOGK=.0024;BGK=.78;FGK=1.26;FGA=10;GAM=.92;GAIN=1.06;}
  else{AR=.11;AG=.13;AB=.2;SR=.17;SG=.2;SB=.29;FOG=[24,21,44];FARG=[24,24,44];FOGK=.009;BGK=.6;FGK=1.6;FGA=26;GAM=.5;GAIN=1.3;}
}
setMode(1);

function copyCell(a,b){                 // the row below gets what the row above worked out
  chars[b]=chars[a];Lt[b]=Lt[a];
  const p=a*4,q=b*4;
  fgPix[q]=fgPix[p];fgPix[q+1]=fgPix[p+1];fgPix[q+2]=fgPix[p+2];fgPix[q+3]=255;
  bgPix[q]=bgPix[p];bgPix[q+1]=bgPix[p+1];bgPix[q+2]=bgPix[p+2];bgPix[q+3]=255;
}
function put(i,c,r,g,b,fr,fg,fb,lt){
  chars[i]=c;Lt[i]=lt?1:0;
  const j=i*4;fgPix[j]=fr;fgPix[j+1]=fg;fgPix[j+2]=fb;fgPix[j+3]=255;
  bgPix[j]=r*BGK;bgPix[j+1]=g*BGK;bgPix[j+2]=b*BGK;bgPix[j+3]=255;
}

function shade(i,m,isTop,wx,wy,wz,nx,ny,d,li,ci){
  let base=MAT[m], ramp=RAMPS[m];
  let tex=1,force=0,er=-1,eg=0,eb=0,letter=false,inkR=246,inkG=240,inkB=220;
  const bi=ci>=0?Bi[ci]:0;
  if(bi){
    const B=bld[bi];
    if(isTop||wz>Ev[ci]+.01){                                   // the roof covering
      base=B.roofCol;ramp=ROOFR;
      tex=(.84+.2*(Math.floor(wz*2)&1))*(.9+.2*hash2(Math.floor(wx*2),Math.floor(wy*2)));
    }else{                                                      // a facade, set out from this building's own corners
      let u,u0,len,bay;
      if(nx!==0){u=wy;len=B.wy;bay=B.bayY;u0=nx<0?B.y0:-B.y1;}
      else{u=wx;len=B.wx;bay=B.bayX;u0=ny>0?B.x0:-B.x1;}
      if(!(ny>0||nx<0))u=-u;
      const uu=u-u0, zz=wz-B.base, row=Math.floor(zz);               // along the frontage from one corner, and up from the pavement
      let fl,fz;                                                // which storey, and how far up that storey we are
      if(zz<B.g0){fl=0;fz=zz/B.g0;}else{const q=(zz-B.g0)/B.fh;fl=1+Math.floor(q);fz=q-Math.floor(q);}
      const nb=Math.floor(uu/bay), wu=uu/bay-nb;                // which window bay, and how far across it
      tex=B.tint;if(B.col)base=B.col;
      if(m===6){if(zz-row<.18&&d<70){tex*=.72;force=45;}else tex*=.9+.2*hash2(Math.floor((uu+(row&1))/2),row);}
      else if(m===1){const r3=Math.floor(zz/1.5);tex*=.85+.3*hash2(Math.floor((uu+(r3&1)*1.5)/3),r3);if(zz/1.5-r3<.14&&d<70){tex*=.6;force=45;}}
      else if(m===10){tex*=.94+.12*hash2(Math.floor(uu/3),Math.floor(zz/3));if(fl>0&&fz<.05&&d<70){tex*=.84;force=45;}}
      else if(m===8&&(wu<.09||wu>.91||fz<.09||Math.abs(wu-.5)<.045||(fl>0&&Math.abs(Math.min(wu,1-wu)*2-fz)<.08))){tex=.16;force=35;}
      const cx=Math.abs(wu-.5), doorBay=((nb%B.dEvery)+B.dEvery)%B.dEvery===B.dBay;
      let glass=false,door=false,board=false;
      if(!(B.shop&&fl===0)&&zz<.5){tex*=.74;force=45;}          // a plinth course where the wall meets the pavement
      if(B.mast){                                               // structure, not storeys: girders and stages
        const up=zz*CELL;
        tex*=.72+.3*hash2(Math.floor(uu*.7),Math.floor(zz*.7));
        if(up%22<2.4){tex*=.66;force=61;}                       // a stage every twenty-odd metres
        else if(cx<.12||cx>.88){tex*=.8;force=124;}             // the legs, standing out at the corners
      }else if(B.church){                                       // lancet windows, and a tower that is mostly blank stone
        const tower=B.tower>0&&Ev[ci]>B.base+B.wall+2;
        if(tower){
          const tz=(wz-B.base)/(B.tower-B.base);
          if(zz%9<.4){tex*=.74;force=45;}                         // a string course every four and a half metres
          if(tz>.74&&tz<.9&&cx<.13){tex=.2;force=(row&1)?61:45;}  // belfry louvres
          else if(tz<.22&&cx<.1&&doorBay)door=true;
        }else{
          const t2=(fz-.24)/.62, e2=(t2-.66)/.34;
          const hw=t2<.66?.19:.19*Math.sqrt(Math.max(0,1-e2*e2));  // the head of the window comes to a point
          if(fz>.24&&fz<.86&&cx<hw)glass=true;
          else if(fz>.17&&fz<=.24&&cx<.24){tex*=.78;force=61;}     // the sill course under it
        }
      }else if(B.shop&&fl===0){                                   // a shopfront: fascia board, glazing, stall riser, doorway
        if(fz>.78){
          base=B.signCol;tex=1;force=0;board=true;
          const sg=B.sign, lw=Math.max(1,.42/CELL), wide=sg.length*lw;   // about 42 cm to a letter
          const k=Math.floor((uu-(len-wide)/2)/lw);            // the name reads centred on the frontage
          if(k>=0&&k<sg.length&&sg.charCodeAt(k)!==32){
            force=sg.charCodeAt(k);letter=true;
            inkR=B.signInk[0];inkG=B.signInk[1];inkB=B.signInk[2];
          }
        }
        else if(fz>.73){tex*=.5;force=61;board=true;}
        else if(doorBay&&cx<.17&&fz<.66)door=true;
        else if(fz>.15&&cx<.42){
          glass=true;
          // A shop window is not one sheet: it is framed into lights, with a transom over them.
          // Sized in metres, so the framing shows properly when a cell is a quarter of one.
          const mw=Math.max(.12,CELL*.9), mull=((uu*CELL)%1.15+1.15)%1.15;
          if(mull<mw||(fz>.655&&fz<.70)){glass=false;tex*=.55;force=124;}
        }
        else if(fz<=.15){tex*=.62;force=61;}
      }else{                                                    // plain windows, one to a bay, and a front door
        const lo=fl===0?.3:.26, ww=B.shop?.19:.16;
        if(fl===0&&doorBay&&cx<.12&&fz<.62)door=true;
        else if(fz>lo&&fz<.8&&cx<ww&&wz<Ev[ci]-.7)glass=true;
        else if(fz>lo-.09&&fz<=lo&&cx<ww+.05){tex*=.78;force=61;}
      }
      const eave=Ev[ci]-wz;
      if(!glass&&!door&&!board&&eave<1&&eave>=0){tex*=.62;force=61;}   // the gutter line under the eaves
      if(door){base=[66,48,36];tex=.6;force=35;}
      else if(glass){
        if(mode!==1&&hash2(nb+fl*31,bi)<.5){er=255;eg=196;eb=104;force=35;}
        else{base=[58,80,108];tex=(fz>.6?1.25:.95);force=46;}
      }
    }
  }else if(m===0){
    tex=(.87+.24*hash2(Math.floor(wx*1.1),Math.floor(wy*1.1)))*(.88+.24*vnoise(wx*.05,wy*.05));
    if(ci<0)tex*=.66;                                  // land beyond the square is not a mown lawn
  }
  else if(m===2)tex=.9+.16*hash2(Math.floor(wx/1.5),Math.floor(wy/1.5));
  else if(m===5)tex=(.94+.09*hash2(Math.floor(wx*.7),Math.floor(wy*.7)))*(.95+.1*vnoise(wx*.04,wy*.04));
  else if(m===9)tex=.82+.3*hash2(Math.floor(wx),Math.floor(wy));
  else if(m===12)tex=(.9+.2*hash2(Math.floor(wx/3),Math.floor(wy/3)))*(.86+.28*vnoise(wx*.02,wy*.02));
  else if(m===4){
    const g0=ci>=0?Gr[ci]:G, up=wz-g0, crown=ci>=0?Hm[ci]-g0:2;
    if(!isTop&&up<Math.min(5,crown*.45)){              // the trunk, below where the leaves begin
      base=BARK;ramp=RAMPS[9];
      tex=.78+.44*hash2(Math.floor(wx*1.6),Math.floor(wy*1.6)+Math.floor(wz*1.2)*13);
    }else tex=(.6+.55*hash2(Math.floor(wx*2)+Math.floor(wz*2)*31,Math.floor(wy*2)))*(.8+.4*hash2(Math.floor(wx/9),Math.floor(wy/9)));
  }

  // sun or moon, with cast shadow
  let lam=isTop?LSIN:Math.max(0,nx*LDX+ny*LDY)*LCOS;
  if(lam>0&&li>=0&&shadowH&&wz<shadowH[li]-.05)lam=0;
  let r=base[0]*tex*(AR+SR*lam), g=base[1]*tex*(AG+SG*lam), b=base[2]*tex*(AB+SB*lam);
  if(er>=0){r=er;g=eg;b=eb;}

  if(m===3){                                                // water: reflect whatever the mirrored ray finds
    const s=(cam.z-wz)/d, dirx=(wx-cam.x)/d, diry=(wy-cam.y)/d;
    const rip=reduce?0:(.035*Math.sin(wx*1.3+time*1.5)+.03*Math.sin(wy*1.9-time*1.1)+.02*Math.sin((wx+wy)*3.1+time*2.3));
    let s2=s+rip*(1+s*2);if(s2<.01)s2=.01;
    let hit=-1,t=1.2;
    for(let n=0;n<34&&t<170;n++){
      const X=Math.floor(wx+dirx*t),Y=Math.floor(wy+diry*t);
      if(X<0||Y<0||X>=N||Y>=N)break;
      const c2=Y*N+X;if(Hm[c2]>wz+s2*t){hit=c2;break;}
      t=t*1.13+.8;
    }
    let rr,rg,rb;
    if(hit>=0){
      const b2=Bi[hit]?bld[Bi[hit]].roofCol:MAT[Mt[hit]],f2=1-Math.exp(-(d+t)*FOGE);
      rr=b2[0]*(AR+SR*.4);rg=b2[1]*(AG+SG*.4);rb=b2[2]*(AB+SB*.4);
      rr+=(FOG[0]-rr)*f2;rg+=(FOG[1]-rg)*f2;rb+=(FOG[2]-rb)*f2;
    }else{skyCalc(Math.atan2(diry,dirx),Math.atan(s2/Math.hypot(dirx,diry)),false);rr=o_r;rg=o_g;rb=o_b;}
    const F=.3+.62*Math.exp(-s*5);
    r=r*(1-F)+rr*F*.92;g=g*(1-F)+rg*F*.92;b=b*(1-F)+rb*F*.95;
    force=rip>.03?126:(rip<-.03?61:45);
  }

  const f=1-Math.exp(-d*FOGE);
  r+=(FOG[0]-r)*f;g+=(FOG[1]-g)*f;b+=(FOG[2]-b)*f;
  if(r>255)r=255;if(g>255)g=255;if(b>255)b=255;
  const lum=(.3*r+.59*g+.11*b)/255;
  const hs=hash2(Math.floor(wx*3)+Math.floor(wz*3)*57,Math.floor(wy*3));
  const lg=GAM===1?lum:GAM===.5?Math.sqrt(lum):Math.pow(lum,GAM);
  let k=Math.floor(lg*ramp.length*GAIN*(1-.5*f)+(hs-.5)*((isTop&&!bi)?.5:1.15));
  if(k<0)k=0;else if(k>=ramp.length)k=ramp.length-1;
  const c=(force&&(k>=1||letter))?force:ramp[k];
  if(letter)put(i,c,r,g,b,inkR,inkG,inkB,1);
  else put(i,c,r,g,b,r*FGK+FGA,g*FGK+FGA,b*FGK+FGA+4);
}

/* sky: gradient, sun or moon, stars, drifting clouds */
const CLOUD=Array.from(".:coCO0#",c=>c.charCodeAt(0));
let o_r=0,o_g=0,o_b=0,o_c=32,o_fr=0,o_fg=0,o_fb=0;
function skyCalc(az,el,full){
  o_c=32;o_fr=o_fg=o_fb=0;
  const ca=Math.cos(az),sa=Math.sin(az);
  const e0=el>1?1:el<0?0:el;
  const k=mode===2?Math.pow(e0,.72):Math.sqrt(e0);
  let r,g,b;
  if(mode===1){r=160-104*k;g=196-98*k;b=234-48*k;}
  else if(mode===2){r=250-198*k;g=138-80*k;b=68+36*k;}  // burnt orange along the horizon, dusk blue overhead
  else{r=42-33*k;g=34-24*k;b=68-42*k;}
  let da=az-LAZ;da-=Math.round(da/TAU)*TAU;da*=LCOS;
  const de=el-LEL, rr=Math.sqrt(da*da+de*de);
  if(rr<(mode===2?.075:.06)){
    if(mode===1){o_r=255;o_g=250;o_b=214;o_c=64;o_fr=255;o_fg=255;o_fb=240;}
    else if(mode===2){o_r=255;o_g=176;o_b=88;o_c=64;o_fr=255;o_fg=214;o_fb=150;}
    else{const hs=hash2(Math.floor(da*80),Math.floor(de*80));o_r=200;o_g=196;o_b=168;o_c=hs<.3?79:(hs<.7?64:35);o_fr=250;o_fg=246;o_fb=215;}
    return;
  }
  if(mode===2){                                   // the sun's glow spreads far along a low horizon
    if(rr<.9){const gl=1-rr/.9,q=gl*gl*132;r+=q;g+=q*.5;b+=q*.16;}
  }else if(rr<.4){const gl=1-rr/.4,q=gl*gl*(day?70:46);r+=q;g+=q*.95;b+=q*.8;}
  const o=full?3:2, se=Math.sin(el)+.1, tt=2.4/se, ce=Math.cos(el);
  const u=ca*ce*tt+time*.025, v=sa*ce*tt+time*.011;
  const dn=fbm(u,v,o), cv=sm(.5,.68,dn)*sm(.015,.12,el);
  if(cv>.02){
    let lit=.55+(dn-fbm(u+LDX*.22,v+LDY*.22,o))*4;lit=lit<0?0:lit>1?1:lit;
    lit*=1-.3*cv;
    const cr=mode===1?138+117*lit:mode===2?96+158*lit:26+44*lit,
          cg=mode===1?142+113*lit:mode===2?72+108*lit:26+44*lit,
          cb=mode===1?156+99*lit:mode===2?86+70*lit:40+50*lit;
    r+=(cr-r)*cv;g+=(cg-g)*cv;b+=(cb-b)*cv;
    if(full&&cv>.15){
      let q=Math.floor(cv*(.35+.75*lit)*CLOUD.length);if(q>=CLOUD.length)q=CLOUD.length-1;
      o_c=CLOUD[q];o_fr=r*1.1+12;o_fg=g*1.1+12;o_fb=b*1.1+12;
    }
  }else if(full&&mode===0&&el>.04){
    const ga=Math.floor(az*40), ge=Math.floor(el*40), hs=hash2(ga,ge);
    if(hs<.13){
      const sA=(ga+hash2(ga+91,ge))/40, sE=(ge+hash2(ga,ge+57))/40, c2=Math.cos(el);
      if(Math.abs(az-sA)<aw&&Math.abs(el-sE)<ah*c2*c2){
        const tw=.65+.35*Math.sin(time*3+hs*999), q=(hs<.03?255:190)*tw;
        o_c=hs<.02?42:(hs<.05?43:46);o_fr=q;o_fg=q;o_fb=q+20;
      }
    }
  }
  o_r=r;o_g=g;o_b=b;
}
function sky(i,az,el){skyCalc(az,el,true);put(i,o_c,o_r,o_g,o_b,o_fr,o_fg,o_fb);}

/* ---------- camera + renderer: one grid walk per text column ---------- */
const cam={x:CX,y:CY,z:G+3.4,yaw:-Math.PI/2,pitch:0};   // z is set properly the moment anyone moves
let planeLen=.72;

function render(){
  const px=cam.x,py=cam.y,ez=cam.z,cosY=Math.cos(cam.yaw),sinY=Math.sin(cam.yaw);
  // from a hundred feet up, air that reads as distance at street level reads as milk
  const still=(px===pcx&&py===pcy&&ez===pcz&&cam.yaw===pcyaw&&cam.pitch===pcpit);
  pcx=px;pcy=py;pcz=ez;pcyaw=cam.yaw;pcpit=cam.pitch;
  const step=(still||!easeRows||HR<120)?1:2;
  const upc=ez-groundAt(px,py), up=(upc-6)/140;
  FOGE=FOGK*(1-.78*(up<0?0:up>1?1:up));
  // From a height the ground runs away from you: at a hundred metres up it is seven hundred cells
  // to where you are looking, and a street-level view distance leaves the whole frame empty.
  const far=Math.min(N*1.15,MAXD+upc*3.4), steps=Math.min(3400,1100+(upc*5|0));
  const pl=planeLen,fx=(W/2)/pl,fyS=fx*cw/chhR,horizon=HR/2+cam.pitch*fyS;
  aw=.6/fx;ah=.6/fyS;
  for(let sx=0;sx<W;sx++){
    const camX=2*(sx+.5)/W-1;
    const rdx=cosY-sinY*pl*camX, rdy=sinY+cosY*pl*camX;
    let mx=Math.floor(px), my=Math.floor(py);
    const ddx=Math.abs(1/(rdx||1e-9)), ddy=Math.abs(1/(rdy||1e-9));
    const stepX=rdx<0?-1:1, stepY=rdy<0?-1:1;
    let sideX=(rdx<0?px-mx:mx+1-px)*ddx, sideY=(rdy<0?py-my:my+1-py)*ddy;
    let top=HR,tE=1e-4,side=-1,prev=-1;
    for(let n=0;n<steps;n++){
      let h,m=0,ci=-1;
      if(mx>=0&&my>=0&&mx<N&&my<N){ci=my*N+mx;h=Hm[ci];m=Mt[ci];}
      else h=Gr[(my<0?0:my>=N?N-1:my)*N+(mx<0?0:mx>=N?N-1:mx)];
      if(side>=0){                                           // the wall face we just hit
        let y0=Math.round(horizon-(h-ez)*fyS/tE);if(y0<0)y0=0;
        if(y0<top){
          const hx=px+rdx*tE,hy=py+rdy*tE,nx=side===0?-stepX:0,ny=side===1?-stepY:0;
          for(let r=y0;r<top;r+=step){
            let wz=ez-((r+.5)-horizon)*tE/fyS;if(wz>h)wz=h;
            const i=r*W+sx;shade(i,m,0,hx,hy,wz,nx,ny,tE,prev,ci);
            if(step===2&&r+1<top)copyCell(i,i+W);
          }
          top=y0;
        }
      }
      const tX=sideX<sideY?sideX:sideY;
      if(h<ez){                                              // the top of this cell
        let y0=Math.round(horizon+(ez-h)*fyS/tX);if(y0<0)y0=0;
        if(y0<top){
          for(let r=y0;r<top;r+=step){
            const den=(r+.5)-horizon;let d=den>0?(ez-h)*fyS/den:tX;
            if(d<tE)d=tE;else if(d>tX)d=tX;
            const i=r*W+sx;shade(i,m,1,px+rdx*d,py+rdy*d,h,0,0,d,ci,ci);
            if(step===2&&r+1<top)copyCell(i,i+W);
          }
          top=y0;
        }
      }
      if(top<=0||tX>far)break;
      prev=ci;tE=tX<1e-4?1e-4:tX;
      if(sideX<sideY){sideX+=ddx;mx+=stepX;side=0;}else{sideY+=ddy;my+=stepY;side=1;}
    }
    if(top>0){
      const az=Math.atan2(rdy,rdx);
      for(let r=0;r<top;r+=step){
        const v=(horizon-(r+.5))/fyS, i=r*W+sx;
        if(v>0)sky(i,az,Math.atan(v));
        else put(i,46,FARG[0],FARG[1],FARG[2],FARG[0]*FGK+FGA,FARG[1]*FGK+FGA,FARG[2]*FGK+FGA);
        if(step===2&&r+1<top)copyCell(i,i+W);
      }
    }
  }
}

function frameText(){
  const rows=[];
  for(let y=0;y<HR;y++)rows.push(String.fromCharCode.apply(null,chars.subarray(y*W,(y+1)*W)));
  return rows;
}

/* ---------- canvas output ---------- */
const stage=document.getElementById('stage'), cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const bcv=document.createElement('canvas'), bctx=bcv.getContext('2d');   // one pixel per cell: background colour
const fcv=document.createElement('canvas'), fctx=fcv.getContext('2d');   // one pixel per cell: letter colour
const tcv=document.createElement('canvas'), tctx=tcv.getContext('2d');   // the letters themselves, used as a mask
const STACK='ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace';
const DETAIL=[9,6,4,3], DETAIL_NAME=['medium','fine','extra fine','finest'];
const DETAIL_CAP=[22000,36000,56000,90000];   // on a big screen this, not the type size, sets the resolution
let detail=3,ox=0,oy=0,bimg=null,fimg=null,ready=false,dch=null,dfg=null;
const CH=[];for(let i=0;i<128;i++)CH.push(String.fromCharCode(i));

function setup(){
  const wCss=stage.clientWidth,hCss=stage.clientHeight;
  if(!wCss||!hCss){ready=false;return;}
  const dpr=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(wCss*dpr);cv.height=Math.round(hCss*dpr);
  let fs=DETAIL[detail]*dpr;
  for(;;){
    ctx.font='bold '+fs+'px '+STACK;
    cw=ctx.measureText('MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM').width/40||fs*.6;
    chh=Math.max(4,Math.round(fs));
    W=Math.max(8,Math.floor(cv.width/cw));H=Math.max(6,Math.floor(cv.height/chh));
    if(W*H<=DETAIL_CAP[detail]||fs>60)break;
    fs*=1.08;
  }
  ctx.textBaseline='middle';
  ox=(cv.width-W*cw)/2;oy=(cv.height-H*chh)/2;
  HR=blocks?H*2:H;chhR=blocks?chh/2:chh;   // blocks of either kind work the picture out on twice the rows
  chars=new Uint8Array(W*HR);Lt=new Uint8Array(W*HR);
  fgPix=new Uint8ClampedArray(W*HR*4);bgPix=new Uint8ClampedArray(W*HR*4);
  dch=new Uint8Array(W*H);dfg=new Uint8ClampedArray(W*H*4);
  bcv.width=W;bcv.height=HR;bimg=bctx.createImageData(W,HR);
  fcv.width=W;fcv.height=H;fimg=fctx.createImageData(W,H);
  tcv.width=cv.width;tcv.height=cv.height;tctx.font=ctx.font;tctx.textBaseline='middle';
  planeLen=W*cw>H*chh?.78:.62;
  ready=true;
}

function draw(){
  ctx.fillStyle='#07081a';ctx.fillRect(0,0,cv.width,cv.height);
  if(colour){
    bimg.data.set(bgPix);bctx.putImageData(bimg,0,0);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(bcv,0,0,W,HR,ox,oy,W*cw,H*chh);      // with blocks on this lands two colours to a row of type
    let rows,tint;
    if(blocks){
      // the shape is carried by the colour alone now, so the only letters left are the shop signs:
      // a letter in either half of a cell takes the whole cell, which keeps the fascias readable
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        const d=y*W+x, a=(y*2)*W+x, b=a+W, j=d*4;
        // a letter in either half claims the cell; with letters kept, so does whatever the top half holds
        let k=Lt[a]?a:Lt[b]?b:-1;
        if(k<0&&blocks===2)k=a;
        dch[d]=k<0?32:chars[k];
        if(k<0){dfg[j]=dfg[j+1]=dfg[j+2]=dfg[j+3]=0;}
        else{const m=k*4;dfg[j]=fgPix[m];dfg[j+1]=fgPix[m+1];dfg[j+2]=fgPix[m+2];dfg[j+3]=255;}
      }
      rows=[];
      for(let y=0;y<H;y++)rows.push(String.fromCharCode.apply(null,dch.subarray(y*W,(y+1)*W)));
      tint=dfg;
    }else{rows=frameText();tint=fgPix;}
    // letters: draw every row once in white, then tint the whole sheet with the per-cell colours
    tctx.globalCompositeOperation='source-over';tctx.clearRect(0,0,tcv.width,tcv.height);
    tctx.fillStyle='#fff';
    for(let y=0;y<H;y++)tctx.fillText(rows[y],ox,oy+y*chh+chh/2);
    fimg.data.set(tint);fctx.putImageData(fimg,0,0);
    tctx.globalCompositeOperation='source-in';tctx.imageSmoothingEnabled=false;
    tctx.drawImage(fcv,0,0,W,H,ox,oy,W*cw,H*chh);
    ctx.drawImage(tcv,0,0);
  }else{
    ctx.fillStyle='#d9d4b8';
    const rows=frameText();
    for(let y=0;y<H;y++)ctx.fillText(rows[y],ox,oy+y*chh+chh/2);
  }
}

const MAPCOL=[[58,84,48],[150,140,124],[126,122,112],[44,84,128],[44,76,46],[96,98,108],
  [150,140,124],[150,140,124],[150,140,124],[110,92,66],[150,140,124],

function drawMap(){

// A town built here is kept in the browser, so coming back to it costs nobody another request.
const KEEP_KEY='walk-any-town';
function kept(k){try{const s=localStorage.getItem(KEEP_KEY+':'+k);return s?JSON.parse(s):null;}catch(e){return null;}}
function keep(k,v){
  try{
    const list=JSON.parse(localStorage.getItem(KEEP_KEY)||'[]').filter(x=>x!==k);
    list.push(k);
    while(list.length>3)localStorage.removeItem(KEEP_KEY+':'+list.shift());
    localStorage.setItem(KEEP_KEY+':'+k,JSON.stringify(v));
    localStorage.setItem(KEEP_KEY,JSON.stringify(list));
  }catch(e){try{localStorage.removeItem(KEEP_KEY+':'+k);}catch(_){}}
}
let busy=false, towns=[];
async function liveTerrain(lat,lon,half){        // best effort: without it the town is simply flat
  const n=17, dLat=half/110540, dLon=half/(111320*Math.cos(lat*Math.PI/180)), la=[], lo=[];
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    la.push((lat+((j/(n-1))*2-1)*dLat).toFixed(6));
    lo.push((lon+((i/(n-1))*2-1)*dLon).toFixed(6));
  }
  try{
    const v=[];
    for(let k=0;k<la.length;k+=100){
      const want=Math.min(100,la.length-k);
      const r=await fetch('https://api.open-meteo.com/v1/elevation?latitude='+la.slice(k,k+want).join(',')+
        '&longitude='+lo.slice(k,k+want).join(','),{signal:giveUpAfter(12000)});
      const j=await r.json();
      if(!r.ok||!j.elevation||j.elevation.length!==want)throw new Error('no answer');
      for(const e of j.elevation){if(typeof e!=='number')throw new Error('no cover');v.push(e);}
    }
    const min=Math.min.apply(null,v);
    return {n,base:+min.toFixed(1),dataset:'copernicus90',v:v.map(e=>Math.round((e-min)*10))};
  }catch(e){return null;}
}
const slug=s=>s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

async function loadPlace(q){
  if(busy||!q.trim())return;busy=true;worldReady=false;
  try{
    // a flight's file is named for the route, not for its title, so match the name and the slug as given too
    const t=towns.find(t=>t.slug===slug(q)||t.slug===q||t.name===q);
    if(t){
      say('Loading '+t.name);
      const r=await fetch('data/'+t.slug+'.json',{cache:'no-cache'});
      if(!r.ok)throw new Error('The map file for '+t.name+' is missing from this site.');
      if(!demo)qEl.value=t.name;        // the showcase must not rewrite what somebody is typing
      const townData=await r.json();
      if(t.start)townData.start=t.start;
      if(t.cell)townData.cell=t.cell;
      if(t.route)townData.route=t.route;
      await enter(townData,t.lat,t.lon);
      if(!demo)try{history.replaceState(null,'','#'+t.slug);}catch(e){}
      busy=false;return;
    }
    const key=slug(q), had=kept(key);
    if(had){                                       // built here before, and kept in this browser
      say('Reading '+q+' back from this browser');
      await enter(had.data,had.lat,had.lon);
      try{history.replaceState(null,'','#'+encodeURIComponent(q));}catch(e){}
      busy=false;return;
    }
    say('Finding "'+q+'"');
    let geo;
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q));
      if(!r.ok)throw new Error('status '+r.status);geo=await r.json();
    }catch(e){throw new Error('"'+q+'" is not one of the towns prepared for this site, and the live place search could not be reached. Add it to towns.txt in the site\'s repository and it will be built in.');}
    if(!geo.length)throw new Error('No place called "'+q+'" was found. Try adding the town or country, such as "High Street, East Grinstead, UK".');
    // A place typed in gets what a prepared one gets, as near as a live query can manage. It stops short
    // of the full 500 m because the map servers charge steeply for area: a 400 m square answers in about
    // two seconds where a 600 m one took nearly twenty.
    const lat=+geo[0].lat,lon=+geo[0].lon,half=350;
    const dLat=half/110540,dLon=half/(111320*Math.cos(lat*Math.PI/180));
    const bb='('+(lat-dLat)+','+(lon-dLon)+','+(lat+dLat)+','+(lon+dLon)+')';
    const ql='[out:json][timeout:60];('+['way[building]','relation[building]','way["building:part"]','relation["building:part"]',
      'way[man_made=tower]','way[highway]','way[natural=water]','relation[natural=water]','way[natural=wood]',
      'way[waterway]','way[landuse=forest]','way[amenity=parking]','node[natural=tree]','node[shop][name]','node[amenity][name]'].map(f=>f+bb+';').join('')+');out geom;';
    const place=(geo[0].display_name||q).split(',').slice(0,3).join(',');
    let data=null;
    for(const url of OVERPASS){
      try{
        say('Fetching buildings and streets around '+place+', from '+new URL(url).host);
        const r=await fetch(url+'?data='+encodeURIComponent(ql),{signal:giveUpAfter(20000)});   // plain GET: the servers turn away fancier requests
        if(r.ok){data=await r.json();break;}
      }catch(e){}
    }
    if(!data)throw new Error('"'+q+'" could not be built just now: the map servers would not answer. They are free and shared, so this happens; wait a minute and try again, or add the place to towns.txt in the site\'s repository and it will be built in.');
    data.half=half;
    say('Reading the lie of the land');
    data.ele=await liveTerrain(lat,lon,half);
    await enter(data,lat,lon);
    keep(key,{lat,lon,data});
    qEl.value=place;      // show the place that was actually found, not the spelling that was typed
    try{history.replaceState(null,'','#'+encodeURIComponent(q));}catch(e){}
  }catch(e){worldReady=false;say(e.message);}
  busy=false;
}

/* ---------- walking, flying, input ---------- */
const walker={x:CX,y:CY,feet:G,vz:0,yaw:-Math.PI/2,pitch:0};
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let tour=false,tourA=Math.PI/2+.9;
let route=null,flyD=0,flyWay=1,focus=null;   // the way through the town, how far along it, which way round
function setRoute(pts){           // pts are already in cells
  focus=null;
  if(!pts||pts.length<2){route=null;return;}
  const seg=[],cum=[0];let total=0;
  for(let i=0;i+1<pts.length;i++){
    const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);
    seg.push(l);cum.push(total+=l);
  }
  if(!(total>10)){route=null;return;}
  route={pts,seg,cum,total};
  flyD=0;flyWay=1;
}
function along(d){                // where you are when you have flown this far
  const R=route;
  if(d<=0)return R.pts[0].slice();
  if(d>=R.total)return R.pts[R.pts.length-1].slice();
  let i=0;while(i+1<R.cum.length-1&&R.cum[i+1]<d)i++;
  const t=(d-R.cum[i])/(R.seg[i]||1);
  return[R.pts[i][0]+(R.pts[i+1][0]-R.pts[i][0])*t,R.pts[i][1]+(R.pts[i+1][1]-R.pts[i][1])*t];
}
const keys={};let stick=null;const looks=new Map();let wantJump=false;

// 0 walks, 1 runs, 2 is a turbo for crossing a kilometre of town. Shift bumps it up one while held.
let speed=1;
const SPEEDNAME=['Walk','Run','Turbo'];
const speedNow=()=>(keys.ShiftLeft||keys.ShiftRight)?Math.min(2,speed+1):speed;

const hAt=(x,y)=>{
  let cx=Math.floor(x),cy=Math.floor(y);
  if(cx<0)cx=0;else if(cx>=N)cx=N-1;
  if(cy<0)cy=0;else if(cy>=N)cy=N-1;

};
const groundAt=(x,y)=>Math.max(hAt(x-BODY,y-BODY),hAt(x+BODY,y-BODY),hAt(x-BODY,y+BODY),hAt(x+BODY,y+BODY));
// groundAt is the top of whatever is there, roofs and all, which is what walking wants and flying does not:
// taking a cruising height from it makes the camera leap the height of every tower it passes over.
const terrainAt=(x,y)=>{
  let cx=Math.floor(x),cy=Math.floor(y);
  if(cx<0)cx=0;else if(cx>=N)cx=N-1;
  if(cy<0)cy=0;else if(cy>=N)cy=N-1;
  return Gr[cy*N+cx];
};
// Frame-rate independent smoothing: a fraction per second, not a fraction per frame.
const damp=(rate,dt)=>1-Math.exp(-rate*dt);

function update(dt){
  if(tour){
    if(route&&route.loop&&focus){                   // round and round, watching one thing
      flyD+=dt*(route.total/route.secs);
      if(flyD>=route.total)flyD-=route.total;
      const here=along(flyD);
      cam.x=here[0];cam.y=here[1];
      cam.z=terrainAt(here[0],here[1])+route.height/CELL;
      const want=Math.atan2(focus[1]-here[1],focus[0]-here[0]);
      let turn=want-cam.yaw;turn-=Math.round(turn/TAU)*TAU;
      cam.yaw+=turn*damp(5,dt);
      const flat=Math.hypot(focus[0]-here[0],focus[1]-here[1])*CELL;
      cam.pitch=-Math.atan2(route.height-route.aim,Math.max(30,flat));
      return;
    }
    if(route){                                      // a way through the town, there and back again
      // a long run wants a quicker cruise and more air under it, or it is seven minutes below the towers
      const km=route.total*CELL;
      const sp=Math.max(24,Math.min(62,km/200))/CELL;
      const cruise=Math.min(200,54+km/70);
      flyD+=dt*sp*flyWay;
      if(flyD>=route.total){flyD=route.total;flyWay=-1;}
      else if(flyD<=0){flyD=0;flyWay=1;}
      const here=along(flyD), ahead=along(flyD+flyWay*(30/CELL));
      const ease=Math.min(1,Math.min(flyD,route.total-flyD)/(120/CELL));
      cam.x=here[0];cam.y=here[1];
      cam.z=terrainAt(here[0],here[1])+(cruise*(.3+.7*ease))/CELL;   // rise as you leave, settle as you arrive
      const want=Math.atan2(ahead[1]-here[1],ahead[0]-here[0]);
      let turn=want-cam.yaw;turn-=Math.round(turn/TAU)*TAU;  // swing round to it rather than snapping
      cam.yaw+=turn*damp(2,dt);
      cam.pitch=-.17-.1*ease;
      return;
    }
    tourA+=dt*.07;
    const R=N*.2;                                   // a wider circle over a bigger town
    cam.x=spawn.x+R*Math.cos(tourA);cam.y=spawn.y+R*Math.sin(tourA);cam.z=terrainAt(cam.x,cam.y)+N*.11;
    cam.yaw=Math.atan2(spawn.y-cam.y,spawn.x-cam.x);cam.pitch=-.45;
    return;
  }
  const w=walker;
  let fwd=((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0);
  let str=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  w.yaw+=(((keys.ArrowRight)?1:0)-((keys.ArrowLeft)?1:0))*1.9*dt;
  if(stick){str+=stick.dx;fwd-=stick.dy;}
  const len=Math.hypot(fwd,str);if(len>1){fwd/=len;str/=len;}
  const c=Math.cos(w.yaw),s=Math.sin(w.yaw),sp=[WALKC,RUNC,TURBOC][speedNow()]*dt;
  const nx=w.x+(fwd*c-str*s)*sp, ny=w.y+(fwd*s+str*c)*sp;
  if(groundAt(nx,w.y)<=w.feet+STEPUP)w.x=nx;
  if(groundAt(w.x,ny)<=w.feet+STEPUP)w.y=ny;
  w.x=Math.min(N-2,Math.max(2,w.x));w.y=Math.min(N-2,Math.max(2,w.y));
  const gr=groundAt(w.x,w.y);
  if(w.vz<=0&&w.feet<=gr+STICK){
    w.feet+=(gr-w.feet)*Math.min(1,dt*16);w.vz=0;
    if(wantJump||keys.Space){w.vz=JUMPV;w.feet+=.05*BODY;}
  }else{
    w.vz-=GRAV*dt;w.feet+=w.vz*dt;if(w.feet<gr){w.feet=gr;w.vz=0;}
  }
  wantJump=false;
  cam.x=w.x;cam.y=w.y;cam.z=w.feet+EYE;cam.yaw=w.yaw;cam.pitch=w.pitch;
}

const bTour=document.getElementById('bTour'),bColour=document.getElementById('bColour'),bDetail=document.getElementById('bDetail');
function setTour(v){
  if(!v&&tour&&worldReady){                         // land where you are, rather than back where you started
    let x=Math.min(N-3,Math.max(2,cam.x)),y=Math.min(N-3,Math.max(2,cam.y));
    for(let r=0;r<200;r++){
      const ok=(a,b)=>{const c=Math.floor(b)*N+Math.floor(a);return!Bi[c]&&Mt[c]!==3&&Mt[c]!==4;};
      if(ok(x,y))break;
      const a=r*2.4;x=Math.min(N-3,Math.max(2,cam.x+r*.7*Math.cos(a)));y=Math.min(N-3,Math.max(2,cam.y+r*.7*Math.sin(a)));
    }
    Object.assign(walker,{x,y,feet:groundAt(x,y),vz:0,yaw:cam.yaw,pitch:0});
  }
  tour=v;
  bTour.textContent=v?'Land':(route?'Fly over':'Fly around');
  bTour.setAttribute('aria-pressed',String(v));
}
const takeControl=()=>{if(demo)leaveFront();else if(tour)setTour(false);};
setTour(tour);
bTour.onclick=()=>setTour(!tour);
bColour.onclick=()=>{
  colour=!colour;bColour.textContent=colour?'Colour on':'Colour off';bColour.setAttribute('aria-pressed',String(colour));
  if(!colour&&blocks)setBlocks(0);           // without colour there is nothing for the halves to say
};
const bBlocks=document.getElementById('bBlocks');
const BLOCKNAME=['Blocks off','Blocks on','Blocks + letters'];
function setBlocks(v){
  blocks=v;                                   // 0 letters, 1 two colours a cell, 2 both
  bBlocks.textContent=BLOCKNAME[v];
  bBlocks.setAttribute('aria-pressed',String(v>0));
  setup();
}
bBlocks.onclick=()=>{if(!blocks&&!colour)bColour.onclick();setBlocks((blocks+1)%3);};
const bDay=document.getElementById('bDay');
bDay.onclick=()=>{
  setMode((mode+1)%3);                            // daylight, then evening, then night
  bDay.textContent=MODENAME[mode];
  bDay.setAttribute('aria-pressed',String(mode===1));
};
bDetail.onclick=()=>{detail=(detail+1)%DETAIL.length;bDetail.textContent='Detail: '+DETAIL_NAME[detail];setup();};
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();wantJump=true;takeControl();});

const bRun=document.getElementById('bRun'),runEl=document.getElementById('run');
function setRun(v){
  speed=v;
  bRun.textContent=SPEEDNAME[v];
  bRun.setAttribute('aria-pressed',String(v>0));
  runEl.textContent=SPEEDNAME[v];
  runEl.setAttribute('aria-pressed',String(v>0));
}
bRun.onclick=()=>{setRun((speed+1)%3);takeControl();};
setRun(speed);
runEl.addEventListener('pointerdown',e=>{e.preventDefault();setRun((speed+1)%3);takeControl();});

const MOVE=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'];
addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||(e.target.tagName==='BUTTON'&&(e.code==='Space'||e.code==='Enter'))))return;
  keys[e.code]=true;if(MOVE.includes(e.code)){e.preventDefault();takeControl();}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

const stickEl=document.getElementById('stick'),nubEl=document.getElementById('nub');
cv.addEventListener('pointerdown',e=>{
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const rc=cv.getBoundingClientRect();
  if(e.pointerType==='touch'&&!stick&&e.clientX-rc.left<rc.width/2){
    stick={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0};
    stickEl.style.display='block';stickEl.style.left=(e.clientX-rc.left)+'px';stickEl.style.top=(e.clientY-rc.top)+'px';
    nubEl.style.transform='';
  }else looks.set(e.pointerId,{x:e.clientX,y:e.clientY});
  takeControl();e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(stick&&e.pointerId===stick.id){
    let dx=(e.clientX-stick.ox)/44,dy=(e.clientY-stick.oy)/44;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
    stick.dx=dx;stick.dy=dy;nubEl.style.transform='translate('+dx*33+'px,'+dy*33+'px)';
  }else if(looks.has(e.pointerId)){
    const p=looks.get(e.pointerId);
    walker.yaw+=(e.clientX-p.x)*.006;
    walker.pitch=Math.max(-.9,Math.min(.9,walker.pitch-(e.clientY-p.y)*.004));
    p.x=e.clientX;p.y=e.clientY;
  }
});
const endPtr=e=>{if(stick&&e.pointerId===stick.id){stick=null;stickEl.style.display='none';}looks.delete(e.pointerId);};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('contextmenu',e=>e.preventDefault());

const coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
const baseHint=coarse?'Left thumb moves, right thumb looks. Speed and Jump are bottom right.':'W A S D to move, drag to look, space to jump. The speed button steps through walk, run and turbo.';
hintEl.textContent=baseHint;

/* ---------- the front screen: a city turning behind the search box ---------- */
const SHOWCASE=[
  {slug:'bourton-on-the-water-gloucestershire-uk', note:'Bourton-on-the-Water, over the Windrush',
   focus:[51.88560,-1.75560], radius:200, ratio:.76, height:85, aim:8, secs:22},
  {slug:'wengen-switzerland', note:'Wengen, on its shelf above the valley',
   focus:[46.60540,7.92200], radius:270, ratio:.8, height:170, aim:25, secs:22},
  {slug:'levuka-fiji', note:'Levuka, between the hills and the reef',
   focus:[-17.68330,178.83330], radius:230, ratio:.78, height:110, aim:12, secs:22},
];
const frontEl=document.getElementById('front'), noteEl=document.getElementById('frontnote'),
      formEl=document.getElementById('go'), controlsEl=document.querySelector('.controls'),
      headerEl=document.querySelector('header');
let demoIdx=0, demoT=0, demoBusy=false, hasFlights=false;

function showFront(on){
  demo=on;
  easeRows=!on;                   // no half-shaded rows in a showcase: blocks are there for the detail
  stage.classList.toggle('cinema',on);
  mapEl.hidden=on||!showMap;      // no instruments over a piece of film
  frontEl.hidden=!on;
  controlsEl.hidden=on;
  flightsEl.hidden=!hasFlights;
  if(on){frontEl.insertBefore(formEl,noteEl);frontEl.insertBefore(flightsEl,noteEl);}
  else{headerEl.insertBefore(formEl,controlsEl);headerEl.insertBefore(flightsEl,controlsEl);msgEl.textContent='';}
}
function leaveFront(){if(demo){showFront(false);setTour(false);}}
document.getElementById('home').addEventListener('click',()=>{
  if(demo||busy)return;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  showFront(true);
  demoIdx=0;runDemo(0);
});

async function runDemo(i){
  if(demoBusy||busy)return;
  demoBusy=true;
  const s=SHOWCASE[i%SHOWCASE.length], t=towns.find(x=>x.slug===s.slug);
  if(!t){demoIdx++;demoBusy=false;return;}
  cv.style.opacity='0';
  await new Promise(r=>setTimeout(r,430));      // let the fade finish before the build freezes the thread
  if(!demo){cv.style.opacity='1';demoBusy=false;return;}
  await loadPlace(t.name);
  if(demo&&worldReady){
    const c=cellOf(s.focus[0],s.focus[1]), rx=s.radius/CELL, ry=rx*s.ratio, pts=[];
    for(let k=0;k<=48;k++){const a=k/48*TAU;pts.push([c[0]+rx*Math.cos(a),c[1]+ry*Math.sin(a)]);}
    setRoute(pts);
    if(route){route.loop=true;route.secs=s.secs;route.height=s.height;route.aim=s.aim;focus=c;}
    setTour(true);
    noteEl.textContent=s.note;
    demoT=0;
  }
  cv.style.opacity='1';
  demoBusy=false;
}

/* ---------- loop ---------- */
const statEl=document.getElementById('stat'),streetEl=document.getElementById('street');
// The map is OpenStreetMap's, under the ODbL, which asks that the credit travels with anything drawn
// from it: it stays on the page. The frame timings and the height source sit behind the button.
const bCredit=document.getElementById('bCredit'),moreEl=document.getElementById('more');
bCredit.onclick=()=>{const on=moreEl.hidden;moreEl.hidden=!on;bCredit.setAttribute('aria-expanded',String(on));};
let last=0,fpsAcc=0,fpsN=0,statT=0,tWork=0,tDraw=0;
const clock=(typeof performance!=='undefined'&&performance.now)?()=>performance.now():()=>Date.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;time+=dt;
  if(demo&&worldReady&&tour&&!demoBusy){
    demoT+=dt;
    if(demoT>(route&&route.secs?route.secs:20)){demoIdx++;runDemo(demoIdx);}
  }
  if(ready&&worldReady){
    update(dt);
    const t0=clock();render();
    const t1=clock();draw();drawMap();
    tWork+=t1-t0;tDraw+=clock()-t1;
    fpsAcc+=dt;fpsN++;statT+=dt;
    if(statT>.5){
      statEl.textContent=(W*HR).toLocaleString()+(blocks?' half cells':' characters')+' a frame: '+
        (tWork/fpsN).toFixed(1)+' ms working it out, '+(tDraw/fpsN).toFixed(1)+' ms drawing it, '+
        Math.round(fpsN/fpsAcc)+' fps.';
      tWork=0;tDraw=0;
      const x=Math.floor(walker.x),y=Math.floor(walker.y),n=(x>=0&&y>=0&&x<N&&y<N)?Rn[y*N+x]:0;
      if(n&&!tour)streetEl.textContent=names[n]+'.';
      statT=0;fpsAcc=0;fpsN=0;
    }
  }
  requestAnimationFrame(frame);
}
if(window.ResizeObserver)new ResizeObserver(setup).observe(stage);else addEventListener('resize',setup);
setup();
window.asciiTown={frameText,render,draw,drawMap,update,cam,walker,buildFromOSM,setMode,groundAt,get spawn(){return spawn;},get size(){return[W,H];},get bg(){return bgPix;},get fg(){return fgPix;},get ch(){return chars;}};
requestAnimationFrame(frame);
loadIndex().then(()=>{
  let asked='';
  try{if(location.hash.length>1)asked=decodeURIComponent(location.hash.slice(1));}catch(e){}
  if(asked){showFront(false);qEl.value=asked;loadPlace(asked);return;}
  showFront(true);                              // arrive on the front screen, with a city turning behind it
  detail=DETAIL.length-1;                       // a showcase is worth the finest setting, in blocks
  bDetail.textContent='Detail: '+DETAIL_NAME[detail];
  setBlocks(1);
  setMode(1);                                   // plain daylight: the point is to see the place
  bDay.textContent=MODENAME[1];bDay.setAttribute('aria-pressed','true');
  runDemo(demoIdx);
});
addEventListener('hashchange',()=>{try{const h=decodeURIComponent(location.hash.slice(1));if(h&&slug(h)!==slug(qEl.value)){leaveFront();qEl.value=h;loadPlace(h);}}catch(e){}});
})();
</script>
